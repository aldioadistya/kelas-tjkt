<div class="modal-bg" id="modal-student-edit">
    <div class="modal">
        <h3>✏️ Edit Nama Siswa</h3>
        <div class="field">
            <label>Nama Lama</label>
            <input id="student-edit-old" type="text" disabled style="opacity:0.6; cursor:not-allowed;">
        </div>
        <div class="field">
            <label>Nama Baru <span style="color:var(--rose);">*</span></label>
            <input id="student-edit-new" type="text" placeholder="Masukkan nama baru..." autofocus>
        </div>
        <div class="field">
            <label>Alasan Perubahan (opsional)</label>
            <textarea id="student-edit-reason" placeholder="Contoh: Perbaikan penulisan nama, perubahan nama panggilan, dll." style="min-height:60px;"></textarea>
        </div>
        <div class="field-hint" id="student-edit-warning" style="color:var(--rose); display:none;">⚠️ Nama ini sudah digunakan oleh siswa lain.</div>
        <div class="modal-actions">
            <button class="btn btn-ghost" onclick="closeModal('student-edit')">Batal</button>
            <button class="btn btn-danger" id="student-edit-delete-btn" onclick="deleteStudentFromEdit()">🗑️ Hapus</button>
            <button class="btn btn-primary" onclick="submitStudentEdit()">💾 Simpan</button>
        </div>
    </div>
</div>
