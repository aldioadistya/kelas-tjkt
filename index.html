<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>KelasKu — X TKJ 1</title>
    
    <!-- ===== MANIFEST (buat PWA / APK) ===== -->
    <link rel="manifest" href="manifest.json">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <style>
        /* ===== RESET & VARIABLES ===== */
        :root {
            --bg: #F3F0EA;
            --paper: #FFFFFF;
            --ink: #1C1F2A;
            --ink-soft: #787E8D;
            --line: #E9E4D9;
            --navy: #1E2749;
            --navy-2: #33406E;
            --gold: #C99A4B;
            --gold-soft: #F6ECDA;
            --rose: #D9775A;
            --rose-soft: #FBEAE1;
            --violet: #7B6EF0;
            --violet-soft: #ECE9FC;
            --teal: #2E8F79;
            --teal-soft: #E1F2EC;
            --danger: #C6483C;
            --danger-soft: #F8DEDA;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --shadow-card: 0 2px 10px rgba(28,31,42,0.05);
            --shadow-pop: 0 24px 50px -18px rgba(20,22,35,0.35);
        }
        body.dark {
            --bg: #0E1220;
            --paper: #181E31;
            --ink: #EDEFF6;
            --ink-soft: #8B92AA;
            --line: #272F4C;
            --navy: #2B3766;
            --navy-2: #3E4C86;
            --gold: #DBAF6E;
            --gold-soft: #31281A;
            --rose: #E08A6E;
            --rose-soft: #3A2620;
            --violet: #9C91F6;
            --violet-soft: #252142;
            --teal: #4FBBA0;
            --teal-soft: #12291F;
            --danger: #E1665A;
            --danger-soft: #3A1F1D;
            --shadow-card: 0 2px 16px rgba(0,0,0,0.4);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; }
        body {
            background: #CFCBBE;
            font-family: 'Inter', sans-serif;
            color: var(--ink);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 28px 12px;
            transition: background .3s ease;
        }
        body.dark { background: #05070D; }
        .phone {
            width: 100%; max-width: 412px; background: var(--bg); border-radius: 26px;
            box-shadow: var(--shadow-pop); overflow: hidden; display: flex;
            flex-direction: column; height: 860px; position: relative;
            transition: background .3s ease;
        }
        .statusbar {
            height: 38px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 18px; font-family: 'Sora', sans-serif; font-size: 12px; font-weight: 600;
            color: var(--ink); flex-shrink: 0; border-bottom: 1px solid var(--line);
        }
        .theme-btn {
            width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line);
            background: var(--paper); color: var(--ink); display: flex; align-items: center;
            justify-content: center; cursor: pointer; font-size: 13px;
        }
        .screen { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 8px; scrollbar-width: none; }
        .screen::-webkit-scrollbar { display: none; }

        /* ===== HERO ===== */
        .hero {
            margin: 6px 16px 0; background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
            border-radius: var(--radius-lg); padding: 22px 20px 20px; color: #fff;
            position: relative; overflow: hidden;
        }
        .hero::after {
            content: ""; position: absolute; right: -40px; top: -40px;
            width: 160px; height: 160px; border-radius: 50%;
            background: radial-gradient(circle, rgba(201,154,75,0.35), transparent 70%);
        }
        .hero-top { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
        .hero-eyebrow { font-size: 12px; color: #B7BFDA; font-weight: 500; }
        .hero-name { font-family: 'Sora', sans-serif; font-size: 21px; font-weight: 700; margin-top: 2px; }
        .avatar {
            width: 42px; height: 42px; border-radius: 50%; background: var(--gold);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Sora', sans-serif; font-weight: 700; color: var(--navy); font-size: 15px;
            flex-shrink: 0;
        }
        .hero-tags { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; position: relative; z-index: 1; }
        .htag {
            background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18);
            padding: 6px 11px; border-radius: 99px; font-size: 11.5px; font-weight: 500; color: #EEF0F8;
        }

        /* ===== STAT GRID ===== */
        .stat-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin: 14px 16px 0; }
        .stat-card {
            background: var(--paper); border-radius: var(--radius-md); padding: 13px 12px;
            border: 1px solid var(--line); box-shadow: var(--shadow-card);
        }
        .stat-top { display: flex; align-items: center; gap: 8px; }
        .stat-icon { width: 28px; height: 28px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
        .stat-label { font-size: 10.5px; color: var(--ink-soft); font-weight: 600; letter-spacing: .2px; }
        .stat-value { font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 700; margin-top: 7px; line-height: 1.1; }

        /* ===== SECTION ===== */
        .section { margin: 20px 16px 0; }
        .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
        .section-title { font-family: 'Sora', sans-serif; font-size: 14.5px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
        .section-link { font-size: 11.5px; color: var(--navy-2); font-weight: 700; cursor: pointer; white-space: nowrap; }
        body.dark .section-link { color: var(--gold); }
        .link-row { display: flex; gap: 14px; }
        .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 13px 14px; box-shadow: var(--shadow-card); }
        .row-item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
        .row-item:last-child { border-bottom: none; }
        .row-time { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 12px; color: var(--navy); background: var(--gold-soft); padding: 5px 8px; border-radius: 8px; min-width: 50px; text-align: center; flex-shrink: 0; }
        body.dark .row-time { color: var(--gold); }
        .row-title { font-size: 13.5px; font-weight: 600; }
        .row-sub { font-size: 11.5px; color: var(--ink-soft); margin-top: 1px; }
        .empty { text-align: center; padding: 22px 10px; color: var(--ink-soft); font-size: 12.5px; }

        /* ===== TAB BAR ===== */
        .tabbar {
            display: flex; background: var(--paper); border-top: 1px solid var(--line);
            padding: 8px 2px 11px; flex-shrink: 0;
        }
        .tab {
            flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
            background: none; border: none; cursor: pointer; color: var(--ink-soft);
            font-family: 'Inter', sans-serif; font-size: 9.5px; font-weight: 600;
            padding: 4px 0; position: relative;
        }
        .tab svg { width: 18px; height: 18px; }
        .tab.active { color: var(--navy); }
        body.dark .tab.active { color: var(--gold); }
        .tab.active .tab-dot { display: block; }
        .tab-dot { display: none; width: 4px; height: 4px; border-radius: 50%; background: var(--gold); position: absolute; top: -3px; left: 50%; transform: translateX(-50%); }
        .view { display: none; padding-bottom: 14px; }
        .view.active { display: block; animation: fadein .25s ease; }
        @keyframes fadein { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

        /* ===== PAGE HEAD ===== */
        .pagehead { margin: 6px 16px 0; padding: 6px 2px 2px; }
        .pagehead h1 { font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 800; margin: 0; }
        .pagehead p { font-size: 12.5px; color: var(--ink-soft); margin: 3px 0 0; }

        /* ===== KAS ===== */
        .balance-card {
            margin: 14px 16px 0; background: linear-gradient(135deg, var(--gold) 0%, #E4C486 100%);
            border-radius: var(--radius-lg); padding: 20px; color: var(--navy); position: relative; overflow: hidden;
        }
        .balance-card::after { content: ""; position: absolute; right: -30px; bottom: -40px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,0.25); }
        .balance-label { font-size: 12px; font-weight: 600; opacity: .8; position: relative; }
        .balance-value { font-family: 'Sora', sans-serif; font-size: 29px; font-weight: 800; margin-top: 4px; position: relative; }
        .balance-foot { display: flex; gap: 16px; margin-top: 14px; position: relative; }
        .bf-item { font-size: 11.5px; font-weight: 600; }
        .bf-item b { display: block; font-family: 'Sora', sans-serif; font-size: 14px; margin-top: 1px; }

        .btn { border: none; border-radius: var(--radius-sm); padding: 9px 14px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12.5px; cursor: pointer; }
        .btn-navy { background: var(--navy); color: #fff; }
        .btn-ghost { background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-block { width: 100%; padding: 11px; }

        .tx-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
        .tx-item:last-child { border-bottom: none; }
        .tx-icon { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px; }
        .tx-title { font-size: 13px; font-weight: 600; }
        .tx-sub { font-size: 11px; color: var(--ink-soft); }
        .tx-amt { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 13px; margin-left: auto; }
        .tx-amt.plus { color: var(--teal); }
        .tx-amt.minus { color: var(--rose); }
        .tx-delete { background: none; border: none; color: var(--danger); font-size: 16px; cursor: pointer; padding: 4px; opacity: 0.5; flex-shrink: 0; }
        .tx-delete:active { opacity: 1; }
        .month-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 0 8px; margin-bottom: 4px; }
        .month-name { font-family: 'Sora', sans-serif; font-size: 12.5px; font-weight: 700; color: var(--navy-2); }
        body.dark .month-name { color: var(--gold); }
        .month-sum { font-size: 11px; font-weight: 700; }
        .month-sum.pos { color: var(--teal); }
        .month-sum.neg { color: var(--rose); }
        .block { margin-bottom: 16px; }
        .block:last-child { margin-bottom: 0; }

        .fab-add {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            background: var(--navy); color: #fff; border: none; border-radius: var(--radius-md);
            padding: 12px; font-weight: 700; font-size: 13px; width: 100%; margin-top: 12px;
            cursor: pointer; font-family: 'Inter', sans-serif;
        }

        /* ===== CALENDAR ===== */
        .cal-card { margin: 14px 16px 0; }
        .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .cal-month { font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 700; }
        .cal-nav-btn { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); font-size: 12px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
        .cal-dow { text-align: center; font-size: 10px; font-weight: 700; color: var(--ink-soft); padding-bottom: 4px; }
        .cal-day { position: relative; aspect-ratio:1; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; border-radius: 10px; cursor: pointer; }
        .cal-day.empty { cursor: default; }
        .cal-day.today { border: 1.5px solid var(--gold); }
        .cal-day.selected { background: var(--navy); color: #fff; }
        .cal-day.future { color: var(--ink-soft); opacity: .4; cursor: default; }
        .cal-dot { position: absolute; bottom: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }
        .cal-day.selected .cal-dot { background: #fff; }
        .cal-day.full .cal-dot { background: var(--teal); }
        .cal-day.selected.full .cal-dot { background: #fff; }

        /* ===== HP / PIKET ===== */
        .summary-row { display: flex; gap: 10px; margin: 14px 16px 0; }
        .summary-box { flex: 1; border-radius: var(--radius-md); padding: 14px; text-align: center; }
        .summary-box .n { font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 800; }
        .summary-box .l { font-size: 11px; font-weight: 600; margin-top: 2px; }
        .date-label { font-family: 'Sora', sans-serif; font-size: 13.5px; font-weight: 700; }

        .student-row { display: flex; align-items: center; gap: 11px; padding: 10px 0; border-bottom: 1px solid var(--line); }
        .student-row:last-child { border-bottom: none; }
        .s-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--violet-soft); color: var(--violet); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; font-family: 'Sora', sans-serif; flex-shrink: 0; }
        .s-name { font-size: 13px; font-weight: 600; flex: 1; }
        .toggle-btn { border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 6px 12px; font-size: 11px; font-weight: 700; cursor: pointer; color: var(--ink-soft); }
        .toggle-btn.done { background: var(--teal-soft); border-color: transparent; color: var(--teal); }
        .s-remove { width: 22px; height: 22px; border-radius: 50%; border: none; background: var(--rose-soft); color: var(--rose); font-size: 13px; font-weight: 700; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }

        /* ===== JADWAL ===== */
        .mode-switch { display: flex; gap: 4px; margin: 14px 16px 0; background: var(--paper); border: 1px solid var(--line); border-radius: 13px; padding: 4px; }
        .mode-btn { flex:1; text-align:center; padding:9px 6px; border-radius:9px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--ink-soft); background:none; border:none; font-family:'Inter',sans-serif; }
        .mode-btn.active { background:var(--navy); color:#fff; }
        .day-tabs { display:flex; gap:6px; margin:14px 16px 0; overflow-x:auto; scrollbar-width:none; }
        .day-tabs::-webkit-scrollbar { display:none; }
        .day-chip { flex-shrink:0; padding:8px 14px; border-radius:99px; font-size:12px; font-weight:700; background:var(--paper); border:1px solid var(--line); color:var(--ink-soft); cursor:pointer; }
        .day-chip.active { background:var(--navy); color:#fff; border-color:var(--navy); }

        /* ===== TUGAS ===== */
        .subj-tabs { display:flex; gap:6px; margin:14px 16px 0; overflow-x:auto; scrollbar-width:none; }
        .subj-tabs::-webkit-scrollbar { display:none; }
        .task-item { display:flex; align-items:flex-start; gap:11px; padding:11px 0; border-bottom:1px solid var(--line); }
        .task-item:last-child { border-bottom:none; }
        .task-remove { background:none; border:none; color:var(--ink-soft); font-size:15px; cursor:pointer; flex-shrink:0; padding:0 2px; margin-left:auto; }
        .checkbox { width:20px; height:20px; border-radius:6px; border:2px solid var(--line); flex-shrink:0; margin-top:1px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; }
        .checkbox.checked { background:var(--teal); border-color:var(--teal); }
        .task-title { font-size:13px; font-weight:600; }
        .task-title.checked { text-decoration:line-through; color:var(--ink-soft); }
        .task-meta { display:flex; gap:6px; margin-top:5px; flex-wrap:wrap; }
        .pill { font-size:10px; font-weight:700; padding:3px 8px; border-radius:99px; }
        .pill-due { background:var(--rose-soft); color:var(--rose); }
        .pill-overdue { background:var(--danger-soft); color:var(--danger); }
        .pill-soon { background:var(--gold-soft); color:#9A6B0C; }
        body.dark .pill-soon { color:var(--gold); }
        .pill-file { background:var(--violet-soft); color:var(--violet); cursor:pointer; }

        /* ===== MODAL ===== */
        .modal-bg { position:absolute; inset:0; background:rgba(10,12,20,0.5); display:none; align-items:flex-end; z-index:40; backdrop-filter:blur(2px); }
        .modal-bg.open { display:flex; }
        .modal { background:var(--paper); width:100%; border-radius:22px 22px 0 0; padding:20px; animation:slideup .25s ease; max-height:80%; overflow-y:auto; }
        @keyframes slideup { from { transform:translateY(30px); opacity:0; } to { transform:translateY(0); opacity:1; } }
        .modal h3 { font-family:'Sora',sans-serif; margin:0 0 12px; font-size:16px; }
        .field { margin-bottom:10px; }
        .field label { font-size:11.5px; font-weight:700; color:var(--ink-soft); display:block; margin-bottom:5px; }
        .field input, .field select, .field textarea { width:100%; border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 11px; font-size:13px; font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink); resize:vertical; }
        .field textarea { min-height:80px; font-family:'Inter',sans-serif; }
        .field input[type=file] { padding:8px; background:var(--paper); font-size:11.5px; }
        .field-hint { font-size:10.5px; color:var(--ink-soft); margin-top:4px; }
        .field-checkbox { display:flex; align-items:center; gap:8px; }
        .field-checkbox input[type="checkbox"] { width:18px; height:18px; accent-color:var(--navy); cursor:pointer; }
        .field-checkbox label { font-size:12px; font-weight:600; color:var(--ink); cursor:pointer; }
        .modal-actions { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
        .modal-actions .btn { flex:1; min-width:70px; }

        /* ===== LAPORAN SISWA ===== */
        .report-item { display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer; transition:background .1s ease; }
        .report-item:last-child { border-bottom:none; }
        .report-item .report-icon { font-size:20px; flex-shrink:0; margin-top:2px; }
        .report-item .report-info { flex:1; }
        .report-item .report-title { font-size:13.5px; font-weight:700; }
        .report-item .report-meta { font-size:11px; color:var(--ink-soft); margin-top:2px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
        .report-item .report-status { font-size:9.5px; font-weight:700; padding:2px 10px; border-radius:99px; text-transform:uppercase; letter-spacing:.3px; }
        .report-status.pending { background:var(--gold-soft); color:#9A6B0C; }
        body.dark .report-status.pending { color:var(--gold); }
        .report-status.reviewed { background:var(--violet-soft); color:var(--violet); }
        .report-status.resolved { background:var(--teal-soft); color:var(--teal); }
        .report-status.rejected { background:var(--rose-soft); color:var(--rose); }
        .report-badge { font-size:9.5px; font-weight:700; padding:2px 8px; border-radius:99px; background:var(--line); color:var(--ink-soft); }
        .report-badge.urgent { background:var(--danger-soft); color:var(--danger); }
        .report-badge.anonim { background:var(--violet-soft); color:var(--violet); }

        /* ===== PENGUMUMAN ===== */
        .announce-item { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line); }
        .announce-item:last-child { border-bottom:none; }
        .announce-dot { width:7px; height:7px; border-radius:50%; background:var(--gold); margin-top:5px; flex-shrink:0; }
        .announce-text { font-size:13px; font-weight:600; flex:1; line-height:1.4; }
        .announce-date { font-size:10.5px; color:var(--ink-soft); margin-top:2px; }
        .announce-remove { background:none; border:none; color:var(--ink-soft); font-size:14px; cursor:pointer; flex-shrink:0; padding:0 2px; }

        /* ===== LOGIN OVERLAY ===== */
        .login-overlay {
            position:absolute; inset:0; z-index:60; background:var(--bg);
            display:flex; flex-direction:column; overflow-y:auto;
        }
        .login-hero {
            position:relative; flex-shrink:0; text-align:center;
            background:
                radial-gradient(circle at 88% -8%, rgba(255,255,255,0.14) 0%, transparent 45%),
                radial-gradient(circle at -8% 105%, rgba(255,255,255,0.10) 0%, transparent 42%),
                linear-gradient(150deg, var(--navy) 0%, var(--navy-2) 100%);
            padding:52px 28px 76px;
            display:flex; flex-direction:column; align-items:center;
        }
        .login-hero-badge {
            font-size:10px; font-weight:700; letter-spacing:.8px; text-transform:uppercase;
            color:rgba(255,255,255,0.85); background:rgba(255,255,255,0.12);
            border:1px solid rgba(255,255,255,0.22); padding:5px 13px; border-radius:99px;
            margin-bottom:20px;
        }
        .login-logo {
            width:60px; height:60px; border-radius:18px;
            background:linear-gradient(135deg, var(--gold) 0%, #EED4A0 100%);
            display:flex; align-items:center; justify-content:center; font-size:28px;
            margin-bottom:16px;
            box-shadow:0 14px 26px -8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.5);
        }
        .login-hero-title { font-family:'Sora',sans-serif; font-size:25px; font-weight:800; color:#fff; letter-spacing:-.3px; }
